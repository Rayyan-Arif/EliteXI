<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EliteXI - Login / Signup</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center p-6 bg-gray-900 text-gray-50">
    <div class="w-full max-w-5xl grid lg:grid-cols-2 gap-6">
      <section class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
        <h1 class="text-3xl font-extrabold">
          Elite<span class="text-green-600">XI</span>
        </h1>
        <p class="text-gray-400 mt-3">
          Welcome back. Login to manage clubs, players, transfers, and tournaments.
        </p>

        <form class="mt-8 space-y-4">
          <div>
            <label class="text-sm text-gray-400 block mb-2">Email</label>
            <input
              type="email"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="you@example.com"
            />
          </div>
          <div>
            <label class="text-sm text-gray-400 block mb-2">Password</label>
            <input
              type="password"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="Enter your password"
            />
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="text-gray-400"><input type="checkbox" class="mr-2" />Remember me</label>
            <a href="#" class="text-blue-400">Forgot password?</a>
          </div>
          <button type="button" class="w-full rounded-lg px-4 py-3 bg-green-600 text-white font-semibold">
            Login
          </button>
        </form>
      </section>

      <section class="bg-gray-800 border border-gray-800 rounded-2xl p-8">
        <h2 class="text-2xl font-bold">Create Your Account</h2>
        <p class="text-gray-400 mt-2">
          Join EliteXI and start building your ultimate football club.
        </p>

        <form class="mt-8 space-y-4">
          <div>
            <label class="text-sm text-gray-400 block mb-2">Full Name</label>
            <input
              type="text"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="Your name"
            />
          </div>
          <div>
            <label class="text-sm text-gray-400 block mb-2">Email</label>
            <input
              type="email"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="you@example.com"
            />
          </div>
          <div>
            <label class="text-sm text-gray-400 block mb-2">Password</label>
            <input
              type="password"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="Create a password"
            />
          </div>
          <div>
            <label class="text-sm text-gray-400 block mb-2">Confirm Password</label>
            <input
              type="password"
              class="w-full rounded-lg px-4 py-3 bg-gray-900 border border-gray-800 text-gray-50 placeholder-gray-400"
              placeholder="Confirm password"
            />
          </div>
          <button type="button" class="w-full rounded-lg px-4 py-3 bg-blue-600 text-white font-semibold">
            Signup
          </button>
        </form>
      </section>
    </div>
  </body>
</html>
